experiment:
  id: C6
  description: STP-pretrained artifact-aware consistency model
seed: 42
data:
  root: "${PPG_BP_DATA_ROOT}/processed/pulsedb_full"
  sampling_rate: 125
  window_samples: 1250
  normalization: none
  input_representation: ppg_vpg
  derivative_normalization: per_segment_zscore
  split_filename: split.npy
  label_filter: null
model:
  name: artifact_aware_bp
  artifact_classes: 13
  feature_dim: 512
  hidden_features: 128
  artifact_dropout: 0.2
  backbone:
    name: qumphy_concat_attention_derivative_xresnet1d
    depth: 50
    input_channels: 2
    outputs: 2
    dropout: 0.5
training:
  epochs: 50
  batch_size: 384
  gradient_accumulation_steps: 1
  target_standardization: false
  pretrained_checkpoint: "${PPG_BP_PROJECT_ROOT}/outputs/pulsedb_c6_stp_pretrain/best.pt"
  loss:
    name: label_density_mse
    bin_width: 5.0
    power: 0.5
    smoothing_sigma_bins: 1.0
    minimum_weight: 0.25
    maximum_weight: 4.0
  scheduler: {name: constant}
  early_stopping: {patience: 6, min_delta: 0.0}
  learning_rate: 0.001
  weight_decay: 0.001
  num_workers: 8
  evaluation_num_workers: 0
  amp: true
  device: auto
robustness:
  mode: artifact_consistency
  clean_selection_weight: 0.5
  augmented_supervision_weight: 0.5
  consistency_weight: 0.2
  artifact_type_weight: 0.1
  artifact_severity_weight: 0.05
  validation_transform: motion_artifact
  validation_severity: 0.7
  augmentation:
    probability: 0.8
    maximum_transforms: 1
    minimum_severity: 0.2
    maximum_severity: 1.0
    transforms: &all_artifacts
      - gaussian_noise
      - powerline_noise
      - baseline_drift
      - motion_artifact
      - spike_artifact
      - random_mask
      - clipping
      - contact_compression
      - sensor_gain_offset
      - quantization
      - lowpass_response
      - respiratory_modulation
  evaluation_augmentation:
    probability: 1.0
    maximum_transforms: 1
    transforms: *all_artifacts
  evaluation_suite:
    transforms:
      - motion_artifact
      - spike_artifact
      - contact_compression
      - baseline_drift
      - gaussian_noise
      - clipping
      - sensor_gain_offset
      - lowpass_response
    severities: [0.35, 0.7, 1.0]
