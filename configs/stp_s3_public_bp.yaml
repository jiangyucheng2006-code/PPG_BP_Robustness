experiment:
  id: S3
  description: STP SBP/DBP value estimation after sequential transfer
  fidelity: paper-confirmed stage; public-only cohort omits private Mindray data
seed: 42
data:
  root: "${PPG_BP_DATA_ROOT}/processed/stp_public"
  sources: [MIMICIII]
model:
  name: stp
  stage: bp
  input_channels: 1
  signal_length: 512
  patch_size: 8
  embedding_dim: 128
  encoder_layers: 4
  attention_heads: 8
  feedforward_dim: 256
  dropout: 0.1
  outputs: 2
  head_features: 128
  head_dropout: 0.2
training:
  source_checkpoint: "outputs/stp_s2_public_pattern/best.pt"
  epochs: 50
  batch_size: 256
  learning_rate: 0.0001
  minimum_learning_rate: 0.000001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  early_stopping_patience: 8
  num_workers: 8
  amp: true
  device: auto
