experiment:
  id: STP-F2
  description: Public-data faithful STP BP-pattern adaptation
  fidelity: disclosed Transformer transfer, GRL and PatchGAN reproduced; layer widths are provisional
seed: 42
data:
  root: "${STP_DATA_ROOT}"
  sources: [MIMICIII]
  roles: [supervised_paired]
model:
  name: stp
  stage: pattern
  input_channels: 1
  signal_length: 512
  patch_size: 1
  embedding_dim: 128
  encoder_layers: 4
  attention_heads: 8
  feedforward_dim: 256
  dropout: 0.1
  pattern_classes: 3
  discriminator: patchgan
  gradient_reversal_strength: 1.0
  head_features: 128
  head_dropout: 0.2
training:
  source_checkpoint: "${STP_RUN_ROOT}/F1/best.pt"
  epochs: 30
  batch_size: 8
  optimizer: adam
  learning_rate: 0.001
  betas: [0.8, 0.999]
  scheduler: none
  weight_decay: 0.0
  class_weighting: none
  label_smoothing: 0.0
  gradient_clip_norm: 1.0
  early_stopping_patience: 8
  num_workers: 8
  amp: true
  device: auto
