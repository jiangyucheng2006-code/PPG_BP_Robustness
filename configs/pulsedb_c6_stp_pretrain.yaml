experiment:
  id: C6-pretrain
  description: STP-inspired transformation recognition pretraining
seed: 42
data:
  root: "${PPG_BP_DATA_ROOT}/processed/pulsedb_full"
  sampling_rate: 125
  normalization: none
  input_representation: ppg_vpg
  derivative_normalization: per_segment_zscore
  split_filename: split.npy
model:
  name: artifact_aware_bp
  artifact_classes: 17
  feature_dim: 512
  hidden_features: 128
  artifact_dropout: 0.2
  backbone:
    name: qumphy_concat_attention_derivative_xresnet1d
    depth: 50
    input_channels: 2
    outputs: 2
    dropout: 0.5
training:
  epochs: 5
  batch_size: 384
  learning_rate: 0.001
  weight_decay: 0.001
  num_workers: 8
  amp: true
  device: auto
pretraining:
  severity_loss_weight: 0.1
  augmentation:
    probability: 0.8
    maximum_transforms: 1
    minimum_severity: 0.2
    maximum_severity: 1.0
    transforms:
      - gaussian_noise
      - powerline_noise
      - baseline_drift
      - motion_artifact
      - spike_artifact
      - random_mask
      - clipping
      - contact_compression
      - sensor_gain_offset
      - quantization
      - lowpass_response
      - respiratory_modulation
      - amplitude_inversion
      - time_reversal
      - segment_shuffle
      - time_scaling
