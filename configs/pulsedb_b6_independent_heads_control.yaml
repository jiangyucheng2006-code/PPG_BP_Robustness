seed: 42
data:
  root: "${PPG_BP_DATA_ROOT}/processed/pulsedb_full"
  sampling_rate: 125
  window_samples: 1250
  normalization: none
  input_representation: ppg_vpg
  derivative_normalization: per_segment_zscore
  split_filename: split.npy
  label_filter: null
model:
  name: qumphy_independent_heads_multiscale_xresnet1d
  depth: 50
  input_channels: 2
  outputs: 2
  dropout: 0.5
training:
  epochs: 50
  batch_size: 512
  gradient_accumulation_steps: 1
  target_standardization: false
  loss:
    name: label_density_mse
    bin_width: 5.0
    power: 0.5
    smoothing_sigma_bins: 1.0
    minimum_weight: 0.25
    maximum_weight: 4.0
  scheduler:
    name: constant
  early_stopping:
    patience: 6
    min_delta: 0.0
  learning_rate: 0.001
  weight_decay: 0.001
  num_workers: 8
  evaluation_num_workers: 0
  amp: true
  device: auto
evaluation:
  primary_metric: mean_mae
  report_by_bp_range: true
